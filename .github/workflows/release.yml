name: release

# Publishes cli/ to GitHub Packages as `@nsudhanva/sudhanva` with the workflow's GITHUB_TOKEN.
# No other credential is stored.
#
# The archive is packed once and attached to the GitHub release. A later run for the same tag,
# such as a manual retry, downloads that attachment and publishes the same bytes, so GitHub
# Packages, the GitHub release, sudhanva.me/cli/, and the Homebrew formula share one SHA-256.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.2.0
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the package archive to the GitHub release
      packages: write # publish to GitHub Packages
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@nsudhanva'

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:package

      - name: Check that the tag matches the package version
        run: test "$TAG" = "v$(node -p 'require("./cli/package.json").version')"

      - name: Pack, or reuse the archive already attached to the release
        id: pack
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="sudhanva-${TAG#v}.tgz"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern "$archive.sha256"; then
            sha256sum --check "$archive.sha256"
          else
            # npm names a scoped package's archive nsudhanva-sudhanva-<version>.tgz.
            mv "$(npm pack --silent)" "$archive"
            sha256sum "$archive" | tee "$archive.sha256"
            gh release upload "$TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        working-directory: cli
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "./$ARCHIVE"
