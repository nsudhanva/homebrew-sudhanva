name: release

# Publishes cli/ to npm as `sudhanva` with npm trusted publishing (OIDC). No npm token is stored:
# npmjs.com must list this repository and workflow file as the package's trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the package archive to the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm --version

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:package

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p 'require("./cli/package.json").version')"

      - name: Pack
        id: pack
        working-directory: cli
        run: |
          archive="$(npm pack --silent)"
          sha256sum "$archive" | tee "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attach the archive to the GitHub release
        if: github.event_name == 'release'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to npm
        working-directory: cli
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: npm publish "./$ARCHIVE" --provenance --access public
